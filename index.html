<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hypertap Studios</title>
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --text: #1b1d3a; --muted: #4b4f72; --accent: #5b6cff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0e0f24; --text: #ffffff; --muted: #c3c6e6; --accent: #8c98ff; } }
      body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
      h1 { margin: 0 0 4px; font-size: 28px; }
      h2 { margin: 28px 0 6px; font-size: 19px; }
      p { margin: 0 0 8px; color: var(--muted); }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <h1>Hypertap Studios</h1>
      <p>Small, relaxing mobile games.</p>
      <h2>Hue Tubes: Marble Sort Puzzle</h2>
      <p>A calm color-sorting puzzle for Android: sort glossy marbles into tubes, with a new daily puzzle every day.</p>
      <p><a href="hue-tubes/privacy-policy.html">Privacy policy</a></p>
      <h2>Contact</h2>
      <p><a href="mailto:hypertapstudios.support@gmail.com">hypertapstudios.support@gmail.com</a></p>
    </main>
  </body>
</html>
